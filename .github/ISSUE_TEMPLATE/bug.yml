name: Bug report
description: Report a reproducible problem without including secrets or customer data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the template. Redact database URLs, cookies, tokens, webhook payloads, email addresses, phone numbers, and addresses. Report security vulnerabilities privately as described in `.github/SECURITY.md`.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: What failed?
      placeholder: A concise description of the problem
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Storefront
        - Localization
        - Cart or checkout
        - Orders or fulfillment
        - Appointments
        - Customer account or authentication
        - Admin
        - Images or Cloudinary
        - Email or reminders
        - Database or migrations
        - Deployment or CI
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the route, locale, inputs using fake data, and smallest reliable sequence.
      placeholder: |
        1. Open /en/...
        2. ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Vercel Preview
        - Production
        - Continuous integration
        - Other
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, release, or branch name
      placeholder: abc1234

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only redacted logs, browser/version details, and relevant provider status.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add sanitized screenshots or links to a minimal reproduction.

  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I removed credentials, tokens, cookies, and personal information.
          required: true
        - label: This is not a security vulnerability.
          required: true
